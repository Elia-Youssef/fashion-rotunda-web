<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 64" width="100%" height="100%" fill="none" role="img" aria-labelledby="wm-title wm-desc">
  <title id="wm-title">Fashion Rotunda Identity Lockup</title>
  <desc id="wm-desc">Art Deco horizontal brand lockup combining the architectural Fashion Rotunda mark with tracked geometric capitals.</desc>
  <!-- Integrated Mark (x: 8..56, y: 8..56, size: 48x48) -->
  <g transform="translate(8, 8) scale(0.48)">
    <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="2.5" />
    <circle cx="50" cy="50" r="40" stroke="currentColor" stroke-width="1" stroke-dasharray="2 2" opacity="0.75" />
    <path d="M 23 48 A 27 27 0 0 1 77 48" stroke="currentColor" stroke-width="2" />
    <line x1="50" y1="13" x2="50" y2="21" stroke="currentColor" stroke-width="2" />
    <line x1="33" y1="20" x2="39" y2="27" stroke="currentColor" stroke-width="1.8" />
    <line x1="67" y1="20" x2="61" y2="27" stroke="currentColor" stroke-width="1.8" />
    <path d="M 45 25 L 50 19 L 55 25 L 55 69 L 45 69 Z" fill="currentColor" />
    <path d="M 33 35 L 41 35 L 41 69 L 33 69 Z" fill="currentColor" />
    <path d="M 59 35 L 67 35 L 67 69 L 59 69 Z" fill="currentColor" />
    <path d="M 21 47 L 29 47 L 29 69 L 21 69 Z" fill="currentColor" />
    <path d="M 71 47 L 79 47 L 79 69 L 71 69 Z" fill="currentColor" />
    <path d="M 19 75 L 23 72 L 77 72 L 81 75 L 77 78 L 23 78 Z" fill="currentColor" />
    <path d="M 27 81 L 73 81 L 71 85 L 29 85 Z" fill="currentColor" />
    <line x1="50" y1="88" x2="50" y2="92" stroke="currentColor" stroke-width="2" />
    <line x1="37" y1="88" x2="33" y2="91" stroke="currentColor" stroke-width="1.5" />
    <line x1="63" y1="88" x2="67" y2="91" stroke="currentColor" stroke-width="1.5" />
  </g>

  <!-- Divider Rule between Mark and Wordmark -->
  <line x1="68" y1="16" x2="68" y2="48" stroke="currentColor" stroke-width="1" opacity="0.35" />

  <!-- Wordmark Letterforms (y centered at 32, cap-height: 20) -->
  <g transform="translate(80, 16)" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- FASHION (x: 0..144) -->
    <path d="M 4 28 L 4 8 L 16 8 M 4 17 L 14 17" />
    <path d="M 22 28 L 29 8 L 36 28 M 25 21 L 33 21" />
    <path d="M 52 13 C 52 8 42 7 42 14 C 42 21 52 19 52 24 C 52 30 41 29 41 24" />
    <path d="M 60 8 L 60 28 M 72 8 L 72 28 M 60 18 L 72 18" />
    <path d="M 81 8 L 81 28" />
    <circle cx="98" cy="18" r="10" />
    <path d="M 115 28 L 115 8 M 115 8 L 127 28 M 127 28 L 127 8" />

    <!-- Architectural Diamond Accent -->
    <polygon points="144,14 148,18 144,22 140,18" fill="currentColor" stroke="none" />

    <!-- ROTUNDA (x: 160..328) -->
    <path d="M 162 28 L 162 8 L 171 8 C 176 8 177 17 171 17 L 162 17 M 170 17 L 176 28" />
    <circle cx="191" cy="18" r="10" />
    <path d="M 207 8 L 221 8 M 214 8 L 214 28" />
    <path d="M 228 8 L 228 21 C 228 28 240 28 240 21 L 240 8" />
    <path d="M 248 28 L 248 8 M 248 8 L 260 28 M 260 28 L 260 8" />
    <path d="M 268 28 L 268 8 L 275 8 C 283 8 283 28 275 28 Z" />
    <path d="M 290 28 L 297 8 L 304 28 M 293 21 L 301 21" />
