# The gate on every push and pull request to main. No secrets and no deploy step: deploying stays
# with the release process. CI runs install, typecheck, lint and the unit tests only. The hosted
# runner has no real GPU adapter and the browser suite failed on it (2026-10-13: 30 failures,
# mostly test timeouts on scene and entry-gate waits that never finish), so the browser projects
# run locally on the project machines, against the production build, until the suite fits the
# hosted runner.
name: check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24.12.0'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
