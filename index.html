<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- An empty icon stops the browser requesting /favicon.ico, a 404 that would land in the console. -->
    <link rel="icon" href="data:," />
    <title>Fashion Rotunda, web edition</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <header id="shell-header">
      <h1>Fashion Rotunda, web edition</h1>
    </header>

    <main>
      <nav id="looks"></nav>
      <!-- The stage owns the canvas and nothing else drawn. The card root and the light row sit
         inside it so that, on phones, their sheets overlay the stage without ever resizing it. -->
      <div id="shell-stage">
        <canvas id="scene"></canvas>
        <aside id="shell-card"></aside>
        <div id="shell-light-row">
          <div id="shell-light-panel" hidden></div>
        </div>
      </div>
    </main>

    <!-- The footer takes the backend badge and the proof readout. The strip is an aside because
         the numbers are tangential to the page itself, readouts rather than content. -->
    <footer>
      <aside id="shell-proof"></aside>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
